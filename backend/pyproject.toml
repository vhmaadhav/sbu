[project]
name = "study-buddy-backend"
version = "1.0.0"
description = "Shared Study Buddy API and background processing runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.2",
  "google-api-python-client==2.198.0",
  "google-auth-httplib2==0.4.0",
  "google-auth-oauthlib==1.4.0",
  "kokoro==0.9.4",
  "lancedb==0.34.0",
  "numpy==2.4.6",
  "ocrmac==1.0.1; sys_platform == 'darwin'",
  "openai==2.48.0",
  "pillow==12.3.0",
  "pyarrow==24.0.0",
  "pymupdf==1.28.0",
  "pyobjc-framework-Cocoa==12.2.1; sys_platform == 'darwin'",
  "python-dotenv==1.2.2",
  "python-multipart==0.0.32",
  "python-telegram-bot==22.8",
  "reportlab==4.4.9",
  "rumps==0.4.0; sys_platform == 'darwin'",
  "sentence-transformers==5.6.1",
  "silero-vad==6.2.1",
  "sounddevice==0.5.5",
  "soundfile==0.14.0",
  "streamlit==1.60.0",
  "useful-moonshine-onnx==20251121",
  "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
